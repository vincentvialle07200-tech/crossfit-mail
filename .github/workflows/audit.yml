name: Audit ResaWod (agrégats seulement)
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 outils/audit.py
        env:
          IMAP_USER: ${{ vars.IMAP_USER }}
          RESAWOD_USER: ${{ secrets.RESAWOD_USER }}
          RESAWOD_PASSWORD: ${{ secrets.RESAWOD_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
