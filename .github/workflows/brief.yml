name: Brief du matin

on:
  workflow_dispatch:   # le brief quotidien est lancé par la boucle du tri (vers 7h) ; ici : envoi à la main
    inputs:
      forcer:
        description: "Déposer un brief maintenant (même s'il a déjà été envoyé aujourd'hui)"
        type: boolean
        default: true
      apercu:
        description: "Aperçu seulement (rien n'est déposé dans la boîte)"
        type: boolean
        default: false

concurrency:
  group: brief
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Préparer et déposer le brief
        run: python3 brief.py
        env:
          IMAP_USER: ${{ vars.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESAWOD_USER: ${{ secrets.RESAWOD_USER }}
          RESAWOD_PASSWORD: ${{ secrets.RESAWOD_PASSWORD }}
          FORCER: ${{ inputs.forcer && '1' || '0' }}
          APERCU: ${{ inputs.apercu && '1' || '0' }}
