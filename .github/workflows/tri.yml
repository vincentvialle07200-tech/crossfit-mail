name: Tri IA des mails

on:
  schedule:
    - cron: '*/30 * * * *'   # relance de sécurité : chaque exécution tourne ~5h50 et trie toutes les 10 min
  workflow_dispatch:
    inputs:
      test:
        description: 'Mode test (classe sans rien modifier dans la boîte)'
        type: boolean
        default: false
      nettoyer_doublons:
        description: "Une fois : corbeille pour les copies Urgent / À répondre et les pubs rangées"
        type: boolean
        default: false
      menage:
        description: "Grand ménage : trier tout l'historique de la boîte de réception"
        type: boolean
        default: false
      restaurer:
        description: "Une fois : sortir de la corbeille ATHX et les mails à identifiants classés pub"
        type: boolean
        default: false

concurrency:
  group: tri-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # garder le workflow actif (GitHub désactive les tâches planifiées après 60 j sans activité)

jobs:
  tri:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Restaurer l'état (quota du jour, erreurs)
        uses: actions/cache/restore@v4
        with:
          path: etat
          key: etat-${{ github.run_id }}
          restore-keys: etat-

      - name: Trier la boîte (toutes les 10 min pendant ~5h50) + brief de 7h
        run: |
          if [ "$RESTAURER" = "1" ]; then python3 outils/restaurer.py || exit 1; fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then python3 tri.py; exit $?; fi
          debut=$(date +%s); echecs=0
          while [ $(( $(date +%s) - debut )) -lt 20700 ]; do
            python3 tri.py && echecs=0 || echecs=$((echecs+1))
            python3 brief.py || echo "Brief : échec"
            python3 relances.py || echo "Relances : échec"
            [ $echecs -ge 3 ] && exit 1
            sleep 600
          done
        env:
          IMAP_USER: ${{ vars.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESAWOD_USER: ${{ secrets.RESAWOD_USER }}
          RESAWOD_PASSWORD: ${{ secrets.RESAWOD_PASSWORD }}
          INFOS_URL: ${{ vars.INFOS_URL }}
          RELANCES_MODE: ${{ vars.RELANCES_MODE }}
          DRY_RUN: ${{ inputs.test && '1' || '0' }}
          NETTOYER_DOUBLONS: ${{ inputs.nettoyer_doublons && '1' || '0' }}
          RESTAURER: ${{ inputs.restaurer && '1' || '0' }}
          JOURS: ${{ inputs.menage && '3650' || '3' }}
          MAX_MAILS: ${{ inputs.menage && '4000' || '40' }}
          QUOTA_IA: ${{ inputs.menage && '4000' || '300' }}

      - name: Sauver l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: etat
          key: etat-${{ github.run_id }}

      - name: Garder la tâche planifiée active
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/tri.yml/enable" || true
